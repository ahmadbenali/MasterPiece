<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — northBank</title><link rel="icon" href="../../assets/northbank-favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../css/signin.css"><script src="../../js/signin.js" defer></script></head>
<body><main class="auth-shell">
<div class="auth-modes" aria-label="Account access"><button class="mode-button" type="button" data-mode="login" aria-pressed="true" aria-controls="accessForm"><span>LOG<br>IN</span></button><button class="mode-button" type="button" data-mode="signup" aria-pressed="false" aria-controls="accessForm"><span>SIGN<br>UP</span></button></div>
<section class="auth-content" aria-labelledby="formTitle"><a class="home-link" href="../home/home.html">← Home</a><div class="auth-form-wrap"><span class="access-badge">CUSTOMER ACCESS</span><h1 id="formTitle" data-login-title="Sign in to your account">Sign in to your account</h1><p class="form-description" id="formDescription">Enter your registered email and password to proceed.</p>
<form id="accessForm" action="../verification/verification.html" data-role="personal">
<label class="auth-field" id="nameField" hidden>Full name<span class="input-line"><input name="name" value="Alex Morgan" readonly autocomplete="off"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg></span></label>
<label class="auth-field">Email address<span class="input-line"><input type="email" name="email" value="alex.morgan@email.com" readonly autocomplete="off"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg></span></label>
<label class="auth-field">Password<span class="input-line"><input type="password" name="password" value="sample-passphrase" readonly autocomplete="off"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg></span></label>
<div class="form-options"><label class="remember"><input type="checkbox" name="remember">Remember me</label></div>
<button class="submit-button" id="submitAccess" type="submit">Continue →</button><div class="help-links"><button class="forgot" type="button" id="forgotPassword">Forgot password?</button><button class="forgot" type="button" id="contactAssistance">Contact assistance</button></div><p class="mode-prompt"><span id="modePrompt">New to northBank?</span> <button class="mode-link" id="alternateMode" type="button">Open a new account →</button></p><p class="form-message" id="formMessage" role="status" hidden></p>
</form><p class="preview-note">Preview only. Sample details are provided; no account is created and no credentials are collected.</p></div></section>
</main></body></html>
