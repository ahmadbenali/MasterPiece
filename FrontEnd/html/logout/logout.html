<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Static banking interface preview with the northBank homepage design style">
<title>Session closed — northBank showcase</title>
<link rel="icon" href="../../assets/northbank-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/bootstrap.min.css">
<link rel="stylesheet" href="../../css/workspace.css">
<script src="../../js/workspace.js" defer>
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="auth-nav">
<div class="page-wrap">
<a href="../home/home.html" aria-label="northBank home">
<img class="workspace-logo" src="../../assets/northbank-logo.svg" alt="northBank">
</a>
</div>
</header>
<main id="main" class="session-page">
<section class="session-box">
<div class="success-icon">◇</div>
<div class="eyebrow">Personal account</div>
<h1 class="display-title">Session securely closed.</h1>
<p class="muted">You’ve reached the end of the sample session.</p>
<div class="notice ">Station: US-EAST-09 · 00h 18m session duration</div>
<a class="btn-wise btn-dark" href="../customer-login/customer-login.html">Return to sign in →</a>
<p class="small-copy mt-4">Visual confirmation only. No real sessions or tokens exist.</p>
</section>
</main>
<div class="workspace-toast" id="toast" role="status" hidden>
</div>
<dialog id="previewDialog" class="preview-dialog">
<button class="close-dialog" aria-label="Close dialog">×</button>
<h2>Preview information</h2>
<p id="dialogCopy">
</p>
<button class="btn-wise btn-dark" data-dialog-close>Got it</button>
</dialog>
</body>
</html>
